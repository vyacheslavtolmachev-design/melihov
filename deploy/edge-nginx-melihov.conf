# Фрагмент для /opt/timesheet/nginx/nginx.prod.conf.template (общий edge-nginx).
# Вставить перед блоком «# --- lexa-kb.ru (timesheet) ---».
# Шаг 1 — только HTTP-блок (нужен для выпуска сертификата).
# Шаг 2 — после выпуска сертификата добавить HTTPS-блок.

# --- melihov.lexa-kb.ru (melihov, «Сады Наследия») ---
# Headless WordPress + витрина Next.js под одним доменом (сеть proxy_net, alias в compose melihov).
# Пути WordPress (совпадают с passthrough в mu-plugins/heritage-content.php) -> melihov-wp,
# всё остальное -> melihov-frontend.
server {
    listen 80;
    listen [::]:80;
    server_name melihov.lexa-kb.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://melihov.lexa-kb.ru$request_uri;
    }
}

# ---- шаг 2: HTTPS-блок, добавлять после выпуска сертификата ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name melihov.lexa-kb.ru;

    ssl_certificate /etc/letsencrypt/live/melihov.lexa-kb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melihov.lexa-kb.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Медиатека WordPress: upload_max_filesize в wordpress/uploads.ini — 128M.
    client_max_body_size 128m;

    location ~ ^/(wp-admin|wp-login\.php|wp-content|wp-includes|wp-json|wp-cron\.php|graphql) {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $melihov_wp_upstream melihov-wp;
        proxy_pass http://$melihov_wp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $melihov_frontend_upstream melihov-frontend;
        proxy_pass http://$melihov_frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
